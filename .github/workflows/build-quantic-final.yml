name: Build Quantic OS Final ISO

on:
  workflow_dispatch:
  push:
    branches: [final/quantic-os-v1]

permissions:
  contents: read

concurrency:
  group: quantic-final-${{ github.ref }}
  cancel-in-progress: true

jobs:
  final-remaster:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - name: Free runner disk space
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /opt/hostedtoolcache/CodeQL || true
          docker system prune -af || true
          df -h

      - name: Install remaster tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends xorriso erofs-utils e2fsprogs rsync curl util-linux

      - name: Validate Quantic source
        run: |
          python3 -m pip install -q pytest
          python3 -m pytest -q
          bash -n scripts/*.sh services/*.sh
          python3 -m py_compile services/*.py scripts/*.py
          grep -q 'QUANTIC-DATA' services/qpersistence.py
          grep -q 'removable_usb' services/qpersistence.py

      - name: Build final Quantic Live ISO
        run: |
          chmod +x scripts/remaster-quantic-final.sh
          scripts/remaster-quantic-final.sh

      - name: Verify final ISO checksum
        run: |
          cd build/live
          sha256sum -c Quantic-OS-Final-Live-x86_64.iso.sha256
          ls -lh Quantic-OS-Final-Live-x86_64.iso

      - name: Split ISO for artifact transport
        run: |
          cd build/live
          split -b 1800M -d -a 2 Quantic-OS-Final-Live-x86_64.iso Quantic-OS-Final-Live-x86_64.iso.part-
          sha256sum Quantic-OS-Final-Live-x86_64.iso.part-* > Quantic-OS-Final-Live-x86_64.parts.sha256
          cat > REASSEMBLE-WINDOWS.txt <<'EOF'
          Put every .part-* file in the same folder, then run in PowerShell:
          $parts = Get-ChildItem 'Quantic-OS-Final-Live-x86_64.iso.part-*' | Sort-Object Name
          $out = [System.IO.File]::Create('Quantic-OS-Final-Live-x86_64.iso')
          foreach ($part in $parts) {
            $bytes = [System.IO.File]::ReadAllBytes($part.FullName)
            $out.Write($bytes, 0, $bytes.Length)
          }
          $out.Close()
          Get-FileHash .\Quantic-OS-Final-Live-x86_64.iso -Algorithm SHA256

          Compare with Quantic-OS-Final-Live-x86_64.iso.sha256 before flashing.
          EOF

      - uses: actions/upload-artifact@v4
        with:
          name: Quantic-OS-Final-Live-x86_64-parts
          path: |
            build/live/Quantic-OS-Final-Live-x86_64.iso.part-*
            build/live/Quantic-OS-Final-Live-x86_64.iso.sha256
            build/live/Quantic-OS-Final-Live-x86_64.parts.sha256
            build/live/REASSEMBLE-WINDOWS.txt
          retention-days: 7
          compression-level: 0
