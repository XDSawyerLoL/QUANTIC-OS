name: Test Quantic V2

on:
  push:
    branches:
      - feature/quantic-v2
  pull_request:
    branches:
      - final/quantic-os-v1

jobs:
  python-v2:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHONPATH: ${{ github.workspace }}
      QUANTIC_MEMORY_AUTH_KEY: /tmp/quantic-memory-auth.key
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install test runner
        run: python -m pip install --upgrade pip pytest

      - name: Compile V2 services
        run: |
          python -m compileall -q services/qagent.py services/qcompanion.py services/qcompanion_daemon.py services/qcontracts.py services/qeventbus.py services/qautonomy.py services/qmemory2.py services/qmemory_capture.py services/qmemory_trust.py services/qmemory_router.py services/qmemory_reasoner.py services/qmemory_graph.py services/qcontext.py services/qquantum_broker.py services/qlearning.py services/qworkflow_learning.py services/qskill_orchestrator.py services/qmultiagent_runtime.py services/qdag_runtime.py services/qplan_foresight.py services/qwindow_bridge.py services/qnotification_bridge.py services/qapproval_bridge.py services/qvoice_neural.py

      - name: Run V2 tests
        run: pytest -q tests/test_v2_foundation.py tests/test_v2_autonomy.py tests/test_v2_memory_dream.py tests/test_v2_memory_trust_graph.py tests/test_v2_memory_router.py tests/test_v2_learning.py tests/test_v2_workflow_learning.py tests/test_v2_skill_orchestrator.py tests/test_v2_multiagent_runtime.py tests/test_v2_dag_runtime.py tests/test_v2_plan_foresight.py tests/test_v2_shell_contract.py tests/test_v2_window_bridge.py tests/test_v2_notifications.py tests/test_v2_approval_bridge.py tests/test_v2_voice_neural.py

  shell-build:
    runs-on: ubuntu-latest
    container: fedora:44
    timeout-minutes: 12
    steps:
      - name: Install build dependencies
        run: dnf -y install git cmake ninja-build gcc-c++ qt6-qtbase-devel qt6-qtdeclarative-devel qt6-qtsvg-devel

      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Quantic shell
        run: cmake -S shell -B build-shell -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Compile Quantic shell
        run: cmake --build build-shell --parallel 2
