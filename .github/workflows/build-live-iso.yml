name: Quantic CI

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Python tests
        run: |
          python3 -m pip install -q pytest
          python3 -m pytest -q

      - name: Shell syntax
        run: |
          bash -n scripts/*.sh services/*.sh

      - name: Python syntax
        run: |
          python3 -m py_compile services/*.py scripts/*.py

      - name: Foundation checks
        run: |
          chmod +x scripts/verify-foundation.sh
          scripts/verify-foundation.sh

      - name: Build-strategy guard
        run: |
          test -f scripts/remaster-fedora-kde.sh
          test -f docs/BUILD-STRATEGY.md
          grep -q 'BASE_SHA256=' scripts/remaster-fedora-kde.sh
          grep -q 'boot_image any replay' scripts/remaster-fedora-kde.sh
          echo 'Hosted CI validates Quantic source only; it no longer rebuilds Fedora with KIWI inside Ubuntu.'
